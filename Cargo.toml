[package]
name = "faultline"
version = "0.1.0"
edition = "2021"
authors = ["Berat Besli <beratbesli26@gmail.com>"]
description = "Automatic database migration counterexample synthesizer"
repository = "https://github.com/beratbesli/Faultline"
license = "Apache-2.0 OR MIT"

[lib]
name = "faultline"
path = "src/lib.rs"

[[bin]]
name = "faultline"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-postgres = { version = "0.7.10", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
postgres-types = { version = "0.2.6", features = ["derive", "with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Keep the established serde_yaml API while using the maintained fork.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
rand = "0.8"
rand_chacha = "0.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
colored = "3.1"
tempfile = "3.10"
petgraph = "0.8"
async-trait = "0.1"
